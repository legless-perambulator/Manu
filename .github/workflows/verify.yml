name: verify

# The audit's MANU-013: `pnpm check` stopped at the TypeScript boundary, so the
# security-critical layer — path confinement, atomic writes, credential storage
# — was the least covered by CI. Every layer runs here now.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Format
        run: pnpm run format:check
      - name: Tests
        run: pnpm run test

  rust:
    name: Rust host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Tauri's Linux host needs the webkit and GTK development headers to
      # compile, even for `cargo test`.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: cargo fmt
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - name: cargo clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  package:
    name: Production build
    runs-on: ubuntu-latest
    # Only after both layers pass: a packaging failure is much slower to
    # diagnose than a test failure, and this is the slowest job by far.
    needs: [typescript, rust]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf fuse libfuse2 xvfb

      - run: pnpm install --frozen-lockfile

      - name: Build the desktop bundle
        run: pnpm run build:desktop

      # The audit launched the AppImage headlessly under Xvfb and found it ran.
      # That check catches an entire class of "works in dev" packaging failures,
      # so it runs here rather than being repeated by hand.
      - name: Smoke-test the AppImage
        run: |
          APPIMAGE=$(find apps/desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          test -n "$APPIMAGE" || { echo "no AppImage produced"; exit 1; }
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 3
          DISPLAY=:99 WEBKIT_DISABLE_COMPOSITING_MODE=1 "$APPIMAGE" > app.log 2>&1 &
          APP_PID=$!
          sleep 20
          kill -0 "$APP_PID" || { echo "the app exited early:"; cat app.log; exit 1; }
          kill "$APP_PID"
          echo "AppImage launched and stayed up."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
