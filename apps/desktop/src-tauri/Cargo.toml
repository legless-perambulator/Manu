[package]
name = "jellytind-desktop"
version = "0.0.0"
description = "JellyTind desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "jellytind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Host-side HTTP so provider calls leave from Rust, not the webview: the
# renderer is never granted blanket network access and provider endpoints are
# scoped in capabilities/default.json.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS credential store for provider API keys. `vendored` statically links libdbus
# so a Secret Service build does not require system dev packages.
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "vendored",
] }
